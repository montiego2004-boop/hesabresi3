name: Local accounting and offline PWA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:offline
      - uses: actions/upload-artifact@v4
        with:
          name: daneh-hesab-static-site
          path: dist/
